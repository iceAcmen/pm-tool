# #24 修复：批准 esbuild（vite→vitest 依赖链）的构建脚本，使 CI 全新环境
# `pnpm install --frozen-lockfile` 退出 0、不再报 ERR_PNPM_IGNORED_BUILDS。
# pnpm 11.28.5 原生字段 allowBuilds（旧名 onlyBuiltDependencies 兼容）。
allowBuilds:
  esbuild: true

minimumReleaseAgeExclude:
  - '@deepseek-ai/dsh-agent@0.2.1-alpha.2'
  - '@deepseek-ai/dsh-attachment@0.2.1-alpha.2'
  - '@deepseek-ai/dsh-brand@0.2.1-alpha.2'
  - '@deepseek-ai/dsh-commands@0.2.1-alpha.2'
  - '@deepseek-ai/dsh-llm@0.2.1-alpha.2'
  - '@deepseek-ai/dsh-scope@0.2.1-alpha.2'
  - '@deepseek-ai/dsh-session-projection@0.2.1-alpha.2'
  - '@deepseek-ai/dsh-session@0.2.1-alpha.2'
  - '@deepseek-ai/dsh-storage-domain@0.2.1-alpha.2'
  - '@deepseek-ai/dsh-storage@0.2.1-alpha.2'
  - '@deepseek-ai/dsh-system-prompt@0.2.1-alpha.2'
  - '@deepseek-ai/dsh-timeout@0.2.1-alpha.2'
  - '@deepseek-ai/dsh-typert-protocol@0.2.1-alpha.2'
  - '@deepseek-ai/dsh-util-crypto@0.2.1-alpha.2'
  - '@deepseek-ai/dsh-util-values@0.2.1-alpha.2'
  - '@deepseek-ai/dsh-storage-json@0.2.1-alpha.2'
  - lucide-react@1.55.0
